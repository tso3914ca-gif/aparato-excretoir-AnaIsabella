<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Misión: Cuerpo Limpio - El Desafío Renal</title>
<style>
:root {
--primary: #0077b6;
--secondary: #00b4d8;
--accent: #ffb703;
--success: #2ecc71;
--error: #e74c3c;
--text: #03045e;
}

body {
font-family: 'Segoe UI', Roboto, sans-serif;
margin: 0;
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
overflow: hidden;
background: #caf0f8; /* Color de respaldo */
}

/* FONDO CON LA IMAGEN */
.background-image {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background-image: url('https://googleusercontent.com/image_generation_content/0');
background-size: cover;
background-position: center;
filter: blur(5px) brightness(0.9); /* Desenfoque para que resalte el juego */
z-index: -1;
}

#game-container {
background: rgba(255, 255, 255, 0.9);
backdrop-filter: blur(15px);
width: 90%;
max-width: 500px;
padding: 30px;
border-radius: 30px;
box-shadow: 0 20px 50px rgba(0,0,0,0.3);
text-align: center;
border: 2px solid rgba(255,255,255,0.5);
animation: fadeIn 0.8s ease-out;
position: relative;
}

@keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

h1 { color: var(--primary); font-size: 1.8em; margin-top: 0; }

.progress-container { background: #ddd; border-radius: 10px; height: 10px; margin: 15px 0; overflow: hidden; }
#progress-bar { background: var(--primary); height: 100%; width: 0%; transition: width 0.3s; }

.stats-bar {
display: flex;
justify-content: space-around;
background: rgba(255, 255, 255, 0.7);
padding: 12px;
border-radius: 15px;
margin-bottom: 20px;
font-weight: bold;
}

.question { font-size: 1.25em; margin: 20px 0; min-height: 70px; display: flex; align-items: center; justify-content: center; }

.options-grid { display: grid; gap: 12px; }

.btn-opt {
background: var(--secondary);
color: white;
border: none;
padding: 15px;
border-radius: 15px;
cursor: pointer;
font-size: 1.1em;
font-weight: 600;
transition: 0.2s;
box-shadow: 0 5px 0 #0077b6;
}

.btn-opt:hover { transform: translateY(-3px); background: #48cae4; box-shadow: 0 7px 0 #0077b6; }
.btn-opt:active { transform: translateY(2px); box-shadow: 0 1px 0 #0077b6; }

.btn-hint {
background: var(--accent);
color: #5d4037;
border: none;
padding: 8px 20px;
border-radius: 50px;
cursor: pointer;
margin-top: 15px;
font-weight: bold;
}

#hint-text { margin-top: 10px; font-style: italic; color: #555; height: 18px; font-size: 0.9em; }
#feedback { font-size: 2.5em; margin-top: 15px; height: 40px; }
.score-big { font-size: 4em; color: var(--success); font-weight: 800; }
</style>
</head>
<body>

<div class="background-image"></div>

<div id="game-container">
<h1>🔬 Misión: Cuerpo Limpio</h1>
<div class="progress-container"><div id="progress-bar"></div></div>

<div class="stats-bar">
<span>Pregunta: <span id="q-num">1</span>/15</span>
<span>Aciertos: <span id="score">0</span>/15</span>
</div>

<div id="quiz-area">
<div class="question" id="question">Cargando...</div>
<div class="options-grid" id="options"></div>
<button class="btn-hint" onclick="mostrarPista()">💡 Ver Pista</button>
<div id="hint-text"></div>
<div id="feedback"></div>
</div>
</div>

<script>
const preguntas = [
{q: "¿Qué órganos filtran la sangre para crear la orina?", o: ["Riñones", "Pulmones"], c: "Riñones", p: "Tienen forma de frijol."},
{q: "¿Cómo se llama el conducto que lleva la orina a la vejiga?", o: ["Uréter", "Esófago"], c: "Uréter", p: "Termina en 'er'."},
{q: "¿Qué bolsa elástica almacena la orina?", o: ["Vejiga", "Páncreas"], c: "Vejiga", p: "Se infla como un globo."},
{q: "¿Por cuál conducto sale la orina al exterior?", o: ["Uretra", "Tráquea"], c: "Uretra", p: "Canal final, empieza por U."},
{q: "¿Cuál es la principal misión del aparato excretor?", o: ["Limpiar desechos", "Bombear sangre"], c: "Limpiar desechos", p: "Elimina lo que no sirve."},
{q: "¿Cómo se llaman los filtros microscópicos del riñón?", o: ["Nefronas", "Neuronas"], c: "Nefronas", p: "Empieza por Nef-."},
{q: "¿De qué color es la orina si bebes suficiente agua?", o: ["Amarillo claro", "Rojo"], c: "Amarillo claro", p: "Es casi transparente."},
{q: "¿Qué eliminamos a través de los poros de la piel?", o: ["Sudor", "Saliva"], c: "Sudor", p: "Sale cuando tienes calor."},
{q: "Si aguantas mucho las ganas de ir al baño, ¿qué órgano sufre?", o: ["La vejiga", "El corazón"], c: "La vejiga", p: "El depósito de orina."},
{q: "¿Qué sobra en nuestro cuerpo y forma la orina?", o: ["Agua y toxinas", "Aire"], c: "Agua y toxinas", p: "Líquidos y desechos químicos."},
{q: "¿Cuántos riñones tenemos normalmente?", o: ["Dos", "Uno"], c: "Dos", p: "Uno a cada lado."},
{q: "¿Qué arteria lleva la sangre a los riñones?", o: ["Arteria Renal", "Vena Cava"], c: "Arteria Renal", p: "Nombre derivado de Riñón."},
{q: "¿Cómo se llama el equilibrio del cuerpo?", o: ["Homeostasis", "Gimnasia"], c: "Homeostasis", p: "Empieza por H."},
{q: "¿Los riñones trabajan incluso cuando dormimos?", o: ["Verdadero", "Falso"], c: "Verdadero", p: "Nunca descansan de limpiar."},
{q: "¿Cuál de estos es un desecho químico de la orina?", o: ["Urea", "Oxígeno"], c: "Urea", p: "Empieza por U."}
];

let currentIdx = 0, aciertos = 0;

function renderQuestion() {
if (currentIdx < preguntas.length) {
document.getElementById('q-num').innerText = currentIdx + 1;
document.getElementById('progress-bar').style.width = ((currentIdx / preguntas.length) * 100) + "%";
document.getElementById('question').innerText = preguntas[currentIdx].q;
document.getElementById('hint-text').innerText = '';
const container = document.getElementById('options');
container.innerHTML = '';
preguntas[currentIdx].o.forEach(opt => {
const btn = document.createElement('button');
btn.className = 'btn-opt';
btn.innerText = opt;
btn.onclick = () => verificar(opt);
container.appendChild(btn);
});
document.getElementById('feedback').innerText = '';
} else { finalizar(); }
}

function mostrarPista() { document.getElementById('hint-text').innerText = preguntas[currentIdx].p; }

function verificar(eleccion) {
const feedback = document.getElementById('feedback');
if (eleccion === preguntas[currentIdx].c) {
aciertos++;
document.getElementById('score').innerText = aciertos;
feedback.innerText = "✅";
feedback.style.color = "var(--success)";
} else {
feedback.innerText = "❌";
feedback.style.color = "var(--error)";
}
document.querySelectorAll('.btn-opt').forEach(b => b.disabled = true);
currentIdx++;
setTimeout(renderQuestion, 1000);
}

function finalizar() {
document.getElementById('progress-bar').style.width = "100%";
document.getElementById('game-container').innerHTML = `
<div style="animation: fadeIn 0.5s">
<h2>🏆 ¡Misión Terminada!</h2>
<div class="score-big">${aciertos}/15</div>
<p>${aciertos >= 13 ? "¡Nivel Experto! Excelente nota." : "¡Buen esfuerzo! Repasa un poco más."}</p>
<button class="btn-opt" onclick="location.reload()" style="width: 100%">Reiniciar</button>
</div>`;
}
renderQuestion();
</script>
</body>
</html>
